[project]
name = "pillows-upload"
description = "Bulk upload files to pillows.su via the chunked upload API"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "niquests>=3.10.0",
    "tqdm>=4.66.0",
    'tomli>=1.0.0; python_version < "3.11"',
    "typing-extensions>=4.16.0",
]

[project.scripts]
pillows-upload = "pillows_upload.cli:main"

[project.optional-dependencies]
xlsx = [
    "openpyxl",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
    "ty>=0.0.1a1",
    "openpyxl>=3.1.0",
    "tomli>=2.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "pillows_upload.constants.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
    "COM812",  # handled by ruff format (trailing commas)
    "ISC001",  # handled by ruff format (implicit string concat)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["pillows_upload"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty]
environment = { python-version = "3.11" }
[[tool.ty.overrides]]
include = ["tests/**"]
[tool.ty.overrides.rules]
"not-subscriptable" = "ignore"
"unresolved-attribute" = "ignore"
"invalid-argument-type" = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "tomli>=2.4.1",
    "ty>=0.0.65",
]
